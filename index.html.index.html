<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mhmdazadaaasssaaa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #667eea;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #5563c1;
        }
        .error {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 15px;
        }
        .hidden {
            display: none;
        }
        .content-box h1 {
            color: #2d3748;
        }
        .content-box p {
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- نافذة تسجيل الدخول -->
        <div id="loginBox">
            <h2>Mhmdazadaaasssaaa</h2>
            <p>الرجاء إدخال كلمة المرور وتاريخ الميلاد للمتابعة</p>
            
            <div class="input-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>

            <div class="input-group">
                <label for="birthdate">تاريخ الميلاد:</label>
                <input type="date" id="birthdate">
            </div>

            <button onclick="checkCredentials()">دخول</button>
            <div class="error" id="errorMsg"></div>
        </div>

        <!-- محتوى الموقع بعد تسجيل الدخول بنجاح -->
        <div class="content-box hidden" id="contentBox">
            <h1>مرحباً بك في موقع Mhmdazadaaasssaaa!</h1>
            <p>لقد قمت بتسجيل الدخول بنجاح. هذا هو محتوى الموقع الأساسي الخاص بك.</p>
        </div>
    </div>

    <script>
        // البيانات المحددة للوصول
        const correctPassword = "2007272";
        const correctBirthdate = "2000-01-25"; // التنسيق القياسي للسنة-الشهر-اليوم يوافق 25012000

        function checkCredentials() {
            const passInput = document.getElementById("password").value;
            const dateInput = document.getElementById("birthdate").value;
            const errorMsg = document.getElementById("errorMsg");

            if (passInput === correctPassword && dateInput === correctBirthdate) {
                // إخفاء خانات الدخول وعرض محتوى الموقع
                document.getElementById("loginBox").classList.add("hidden");
                document.getElementById("contentBox").classList.remove("hidden");
            } else {
                errorMsg.textContent = "كلمة المرور أو تاريخ الميلاد غير صحيح، حاول مرة أخرى.";
            }
        }
    </script>

</body>
</html>
